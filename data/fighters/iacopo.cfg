; IACOPO (Bisio) - non puo' correre, ha la catena come secondaria
[character]
skin = 1
display_name = "Iacopo"

[stats]
max_health = 150
can_run = false

[model]
node = "Iaco_Spto"
; la hitbox di iacopo sta dentro il nodo Chain, non direttamente sotto Iaco_Spto
hitbox_node = "Chain/PunchHitbox"
; nodo (relativo al modello) che riproduce l'animazione "hit" al posto dello sprite principale
attack_fx_node = "Chain"

; --- potere secondario (tasto destro) ---
; Per cambiare potere basta cambiare "script": i settings sotto sono quelli di
; chain_power_charged.gd (che a sua volta estende chain_power.gd, quindi eredita
; anche i settings della catena veloce). Avviando il gioco dall'editor, la
; console stampa tutti i settings di uno script che qui non sono scritti
; (con i loro default).
;
; Due mosse sullo stesso tasto:
;  - tocco veloce (sotto charge_time)  -> catena che scorre sul terreno
;  - tenuto premuto oltre charge_time  -> nasce il pointer, che avanza da
;    solo (non si controlla); rilasciando il tasto la catena si abbatte a
;    colonna (area denial) sul punto raggiunto dal pointer
;
; Ognuna delle due ha la sua stamina (barra sotto quella della vita, tetto a
; 100 in base.cfg [stats]): stamina_min/stamina_cost per il tocco veloce,
; charge_stamina_min/charge_stamina_cost per la colonna caricata (di solito
; piu' cari). Se il tocco veloce basta ma non la carica, tenendo premuto oltre
; charge_time senza abbastanza stamina parte comunque il tocco normale al
; rilascio. La stamina si recupera nel tempo (di piu' correndo) e colpendo a
; segno col pugno normale (vedi base.cfg [stats]).
[secondary]
script = "res://SCRIPT/powers/chain_power_charged.gd"
debug = true

; --- catena veloce (tocco) ---
damage = 20
cooldown = 4
height_ratio = 0.3
speed = 450.0
stamina_min = 20.0
stamina_cost = 20.0

; --- attacco caricato: pointer (avanza da solo, non controllabile) ---
charge_time = 0.5
pointer_speed = 300.0
pointer_max_distance = 500.0
pointer_alpha = 0.55
charge_stamina_min = 40.0
charge_stamina_cost = 55.0

; --- attacco caricato: colonna (big_chain, area denial) ---
column_damage = 8
column_duration = 5.0
column_tick_interval = 0.4
column_height_ratio = 1.4
; se il pilastro non tocca terra, ritocca questa quota (indipendente dal pointer)
column_feet_y = 70.0
; fotogramma su cui resta bloccata la colonna a spawn finito (-1 = ultimo)
column_hold_frame = -1

; ============================================================
;  FATALITY - combo del colpo di grazia per Iacopo (Bisio)
; ============================================================
;  Sequenza richiesta: giu, giu, quadrato, cerchio
;  (in Godot: p1_down/p2_down, poi di nuovo down, poi l'action
;  "attack" = tasto/pulsante quadrato, poi "secondary" = cerchio)
;  Deve essere completata entro "combo_window" secondi.
;  Vale SOLO quando l'avversario e' gia' all'ultimo HP ("downed").
;
;  NOTA IMPORTANTE sull'animazione: la sezione [anim_<vittima>_iacopo] NON va
;  qui. Ogni personaggio costruisce il proprio sprite/animazioni SOLO dalle
;  sezioni [anim_*] scritte nel SUO PROPRIO file .cfg. Quindi se Iacopo
;  uccide Trab, l'animazione "trab_iacopo" va aggiunta in trab.cfg (vedi
;  esempio li'), non qui. Se Iacopo uccide Naka -> naka.cfg, ecc.
[fatality]
combo = "down,down,attack,secondary"
combo_window = 1.4
