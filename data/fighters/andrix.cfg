; ANDRIX - sprite costruito a runtime dai fogli sprite [anim_*]
; (nella scena Player non ha un AnimatedSprite2D pronto).
; Ogni fotogramma e' un quadrato di frame_size px; "frames" = quanti
; fotogrammi usare (i riquadri vuoti in fondo al foglio vengono ignorati).
[character]
skin = 3
display_name = "Andrix"

[model]
node = "andrix_Sprite"
; il foglio e' a 256px per fotogramma, piu' grande degli altri personaggi:
; prova a scendere sotto 1.0 se in gioco risulta troppo grande.
scale = 1.0
frame_size = 256

[anim_idle]
sheet = "res://sprite/Player/Andrix/idle/andrix-idle-trimmed.png"
hframes = 5
vframes = 5
frames = 23

[anim_walk]
sheet = "res://sprite/Player/Andrix/walk/andrix-walk-trimmed.png"
hframes = 5
vframes = 3
frames = 13

[anim_run]
sheet = "res://sprite/Player/Andrix/run/andrix-run-trimmed.png"
hframes = 5
vframes = 3
frames = 15

[anim_hit]
sheet = "res://sprite/Player/Andrix/hit/andrix-attack.png"
hframes = 5
vframes = 5
frames = 25

[stats]
max_health = 75
run_speed = 250
attack_move_speed = 50
attack_damage = 15

; POTERE SECONDARIO: Madonnina, flash e congelamento dell'avversario.
[secondary]
script = "res://SCRIPT/powers/andrix_madonnina.gd"
cooldown = 5.0
stamina_min = 60.0
stamina_cost = 60.0
madonna_stamina_min = 100.0
madonna_stamina_cost = 100.0
damage = 8
knife_count = 5
spread_angle = 30.0
speed = 600.0
statue_sprite = "res://sprite/Player/Andrix/madonnina.png"
statue_time = 3.0
flash_time = 0.3
hold_time = 2.0
fall_time = 0.55
poison_duration = 4.0
poison_tick_interval = 0.5
poison_damage = 3
poison_radius = 250.0
poison_particle_amount = 72
knife_effect_time = 1.0
max_distance = 10000.0
offscreen_margin = 10000.0
