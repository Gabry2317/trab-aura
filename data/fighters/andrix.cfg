; ANDRIX - sprite costruito a runtime dai fogli sprite [anim_*]
; (nella scena Player non ha un AnimatedSprite2D pronto).
; Ogni fotogramma e' un quadrato di frame_size px; "frames" = quanti
; fotogrammi usare (i riquadri vuoti in fondo al foglio vengono ignorati).
[character]
skin = 3
display_name = "Andrix"

[model]
node = "andrix_Sprite"
; il foglio e' a 256px per fotogramma, piu' grande degli altri personaggi:
; prova a scendere sotto 1.0 se in gioco risulta troppo grande.
scale = 1.0
frame_size = 256

[anim_idle]
sheet = "res://sprite/Player/Andrix/idle/andrix-idle-trimmed.png"
hframes = 5
vframes = 5
frames = 23

[anim_walk]
sheet = "res://sprite/Player/Andrix/walk/andrix-walk-trimmed.png"
hframes = 5
vframes = 3
frames = 13

[anim_run]
sheet = "res://sprite/Player/Andrix/run/andrix-run-trimmed.png"
hframes = 5
vframes = 3
frames = 15

[anim_hit]
sheet = "res://sprite/Player/Andrix/hit/andrix-attack.png"
hframes = 5
vframes = 5
frames = 25

[stats]
max_health = 75
run_speed = 250
attack_move_speed = 50
attack_damage = 15
