; TRAB - usa tutti i valori di base.cfg
[character]
skin = 0
display_name = "Trab"

[model]
; nome del nodo AnimatedSprite2D dentro Player (se non esiste viene costruito dalle sezioni [anim_*])
node = "TRAB_Sprite2D"

; --- animazione fatality: "trab" e' la VITTIMA, quindi va qui ---
; Il nome della sezione deve essere "anim_<vittima>_<killer>": questa e' per
; quando IACOPO finisce TRAB con la sua combo (giu,giu,quadrato,cerchio).
; Foglio 1280x2560px = griglia 5 colonne x 10 righe, fotogrammi 256x256 (50 totali).
[anim_trab_iacopo]
sheet = "res://sprite/Player/WND_trab/fatality/trab-iacopo-fatality.png"
hframes = 5
vframes = 10
frames = 50
frame_size = 256
fps = 16
loop = false
