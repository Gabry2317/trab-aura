; ============================================================
;  BASE.CFG - valori validi per TUTTI i personaggi
; ============================================================
;  Ogni personaggio ha il suo file (trab.cfg, iacopo.cfg...) e scrive
;  SOLO cio' che cambia rispetto a questo. Se una chiave manca nel file
;  del personaggio si usa quella di qui. Dopo una modifica basta
;  rilanciare il gioco.
; ============================================================

[stats]
max_health = 100
; camminata
speed = 100.0
; corsa
run_speed = 200.0
; velocita' mentre si sta attaccando
attack_move_speed = 10.0
; salto (piu' negativo = salta piu' in alto)
jump_velocity = -200.0
; false = il personaggio non puo' correre
can_run = true
; pugno
attack_damage = 10
; secondi tra la pressione del tasto e il colpo vero e proprio
attack_delay = 0.3
; blocco (tenendo premuto secondary): frazione del danno ancora subita
; (0.3 = il 30%; 0.0 = blocco perfetto; 1.0 = il blocco non serve a nulla).
; Bloccare annulla anche lo stordimento e riduce il rinculo.
block_damage_reduction = 0.3

[feedback]
; rinculo: velocita' orizzontale (px/s) della spinta subita quando si viene colpiti
hit_knockback = 220.0
; stordimento: secondi senza comandi dopo essere stati colpiti
hit_stun_duration = 0.25
; lampo: per quanti secondi lo sprite resta del colore hit_flash_color
hit_flash_duration = 0.12
hit_flash_color = Color(1.0, 0.35, 0.35, 1.0)
; suono a ogni colpo andato a segno
hit_sound = "res://sound/Semple/WND_Trab/HIT1.mp3"
; sangue: particelle per colpo (0 = niente sangue; bloccando ne escono ~30%)
blood_amount = 30
blood_color = Color(0.75, 0.03, 0.03, 1.0)
blood_lifetime = 0.6
blood_speed_min = 60.0
blood_speed_max = 180.0

[model]
; scala della grafica (1.0 = dimensione della scena; 0.7 rimpicciolisce, 1.3 ingrandisce)
scale = 1.0
; lato (px) del fotogramma quando lo sprite viene costruito dai fogli [anim_*]
frame_size = 256
; hitbox del pugno: percorso relativo al modello. Se il personaggio non l'ha in
; scena, viene copiata da hitbox_template_node (percorso assoluto dentro Player).
hitbox_node = "PunchHitbox"
hitbox_template_node = "TRAB_Sprite2D/PunchHitbox"
; opzionali, per una hitbox copiata dal modello (mettili nel file del personaggio):
; hitbox_offset_x = 40.0
; hitbox_offset_y = -20.0
; hitbox_width = 40.0
; hitbox_height = 60.0
