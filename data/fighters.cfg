; ============================================================
;  FIGHTERS.CFG  -  dati dei combattenti di Trab Aura
; ============================================================
;  Come funziona:
;   - [base]    = valori validi per TUTTI i personaggi
;   - [trab] ...= SOLO ciò che cambia rispetto a [base]
;   Se un personaggio non scrive una chiave, usa quella di [base].
;   La logica (salto, movimento, pugno...) e' una sola, in player.gd:
;   qui ci sono solo i numeri. Dopo aver modificato il file basta
;   rilanciare il gioco.
; ============================================================

[base]

; --- vita ---
max_health = 100

; --- movimento ---
; camminata
speed = 100.0
; corsa
run_speed = 250.0
; velocita' mentre si sta attaccando
attack_move_speed = 10.0
; salto (piu' negativo = salta piu' in alto)
jump_velocity = -300.0
; false = il personaggio non puo' correre
can_run = true

; --- pugno ---
attack_damage = 10
; secondi tra la pressione del tasto e il colpo vero e proprio
attack_delay = 0.3

; --- feedback del colpo subito (vedi player.gd: _play_hit_feedback) ---
; rinculo: velocita' orizzontale (px/s) della spinta subita quando si viene colpiti
hit_knockback = 220.0
; stordimento: secondi durante i quali non si risponde ai comandi dopo essere stati colpiti
hit_stun_duration = 0.25
; lampo: per quanti secondi lo sprite resta del colore hit_flash_color dopo il colpo
hit_flash_duration = 0.12
; colore del lampo sullo sprite colpito (RGBA, 0.0-1.0)
hit_flash_color = Color(1.0, 0.35, 0.35, 1.0)
; suono riprodotto a ogni colpo andato a segno
hit_sound = "res://sound/Semple/WND_Trab/HIT1.mp3"

; --- sangue quando si prende danno (particelle rosse, vedi player.gd: _spawn_blood) ---
; blood_amount: quante particelle per colpo (0 = niente sangue; bloccando ne escono ~30%)
blood_amount = 18
; colore delle particelle (RGBA, 0.0-1.0)
blood_color = Color(0.75, 0.03, 0.03, 1.0)
; durata delle particelle in secondi
blood_lifetime = 0.6
; velocita' minima/massima con cui schizzano (px/s)
blood_speed_min = 60.0
blood_speed_max = 180.0

; --- blocco (guardia): tenendo premuto p1_secondary / p2_secondary ---
; frazione del danno ancora subita mentre si blocca (0.3 = si prende solo il 30%
; del danno; 0.0 = blocco perfetto, 1.0 = il blocco non serve a nulla).
; Bloccare annulla anche lo stordimento e riduce il rinculo.
block_damage_reduction = 0.3

; --- attacco secondario "portale + gancio" (vedi player.gd: _process_secondary_attack) ---
; secondary_attack: true SOLO per i personaggi che hanno una mossa speciale
; dedicata sul tasto "secondary" (per tutti gli altri quel tasto blocca, vedi sopra).
; Tenendo premuto appare un portale; rilasciando, dopo un breve ritardo parte
; una catena bassa che si allunga dal personaggio per tutta la mappa: fa danno
; solo per un attimo quando e' a piena estensione, e si puo' schivare saltando.
secondary_attack = false
secondary_damage = 15
; lunghezza della catena in pixel: deve coprire tutta la mappa
secondary_range = 2000.0
; altezza dell'area colpita: bassa apposta, per poterla schivare saltando
secondary_height = 36.0
; quanto in basso rispetto al centro del player parte la catena (vicino ai piedi)
secondary_ground_offset = 80.0
; secondi tra il rilascio del tasto e l'inizio dell'animazione "gancio"
secondary_release_delay = 0.35
; secondi da quando parte "gancio" a quando la catena e' a piena estensione (fa danno)
secondary_hit_delay = 0.25
; per quanti secondi la catena resta a piena estensione e puo' colpire
secondary_hit_window = 0.15
; foglio sprite con le animazioni "portale" (loop, mentre si carica) e "gancio"
; (una volta sola, al rilascio): disegnato in verticale, viene ruotato a runtime
; per crescere in orizzontale. hframes/vframes = griglia del foglio;
; secondary_portal_frames = quanti dei primi fotogrammi sono "portale" (il resto
; e' "gancio").
secondary_sheet = ""
secondary_sheet_hframes = 1
secondary_sheet_vframes = 1
secondary_portal_frames = 1

; --- modello / animazioni ---
; model_node: nome del nodo AnimatedSprite2D di questo personaggio dentro Player.
; use_default_animation_names: true se il personaggio usa i nomi standard
; delle animazioni (idle, walk, run, hit, hurt), letti direttamente da player.gd.
; "hurt" e' opzionale: se lo sprite non ha l'animazione, viene saltata.
; Mettere false se un domani un personaggio avesse nomi diversi (richiede
; comunque una mappatura dedicata nello script).
model_node = ""
use_default_animation_names = true
; model_scale: scala della grafica del personaggio (1.0 = dimensione originale).
; Valori piu' bassi (es. 0.7) rimpiccioliscono, piu' alti (es. 1.3) ingrandiscono.
model_scale = 1.0

; hitbox_node: percorso del nodo hitbox del pugno, relativo al model_node.
; Se il personaggio non ha ancora questo nodo in scena, player.gd ne crea uno
; automaticamente copiando hitbox_template_node (vedi sotto).
hitbox_node = "PunchHitbox"
; hitbox_template_node: hitbox di riferimento (percorso assoluto dentro Player)
; usata come modello per i personaggi senza una hitbox propria in scena.
hitbox_template_node = "TRAB_Sprite2D/PunchHitbox"
; per un personaggio senza hitbox in scena si possono anche personalizzare
; posizione/dimensioni copiate dal modello, scommentando queste chiavi nella
; sua sezione (i valori sotto sono solo un esempio):
; hitbox_offset_x = 40.0
; hitbox_offset_y = -20.0
; hitbox_width = 40.0
; hitbox_height = 60.0


; ============================================================
;  PERSONAGGI  (l'ordine = numero della skin: 0, 1, 2, 3...)
;  IMPORTANTE: il numero di skin di ogni personaggio ora e' deciso
;  dall'ORDINE delle sezioni in questo file (la prima sezione dopo [base]
;  e' skin 0, la seconda skin 1, ecc). Non spostare le sezioni esistenti,
;  altrimenti i pulsanti di selezione personaggio (che usano ancora i
;  numeri 0/1/2 impostati nell'editor) puntano a un personaggio diverso.
;  Per aggiungere un personaggio nuovo basta AGGIUNGERE una sezione IN FONDO:
;  tutte le statistiche, il modello e la hitbox si impostano qui, senza
;  toccare player.gd.
; ============================================================

; skin 0 - usa tutti i valori base
[trab]
model_node = "TRAB_Sprite2D"

; skin 1 - non puo' correre
[iacopo]
can_run = false
model_node = "Iaco_Spto"
; la hitbox di iacopo sta dentro il nodo Chain (la catena), non direttamente
; sotto Iaco_Spto: qui il percorso e' relativo al model_node
hitbox_node = "Chain/PunchHitbox"
; nota: iacopo ha anche il nodo Chain (catena), che riproduce la sua "hit"

; attacco secondario: portale + gancio (catena bassa che copre la mappa)
secondary_attack = true
secondary_damage = 15
secondary_sheet = "res://sprite/Player/Iacobisio/Secondary/big_chains.png"
secondary_sheet_hframes = 7
secondary_sheet_vframes = 2
; i primi 2 fotogrammi (portale che si apre, senza catena) sono "portale";
; i restanti 12 (catena che si allunga, gancio, poi si ritrae) sono "gancio"
secondary_portal_frames = 2

; skin 2 - usa tutti i valori base
[naka]
model_node = "Naka_Sprite"

; skin 3 - Andrix non ha ancora un AnimatedSprite2D pronto nella scena Player:
; il suo modello e' un foglio sprite (spritesheet) per animazione, affettato a
; runtime da player.gd usando i dati qui sotto. Ogni fotogramma e' un quadrato
; di model_frame_size pixel; frames_<anim> = quanti fotogrammi usare (gli
; eventuali riquadri vuoti in fondo al foglio vengono ignorati).
[andrix]
model_node = "andrix_Sprite"
use_default_animation_names = true
; il foglio e' a 256px per fotogramma, piu' grande degli altri personaggi:
; prova a scendere sotto 1.0 se in gioco risulta troppo grande.
model_scale = 1.0
model_frame_size = 256

model_sheet_idle = "res://sprite/Player/Andrix/idle/andrix-idle-trimmed.png"
model_hframes_idle = 5
model_vframes_idle = 5
model_frames_idle = 23

model_sheet_walk = "res://sprite/Player/Andrix/walk/andrix-walk-trimmed.png"
model_hframes_walk = 5
model_vframes_walk = 3
model_frames_walk = 13

model_sheet_run = "res://sprite/Player/Andrix/run/andrix-run-trimmed.png"
model_hframes_run = 5
model_vframes_run = 3
model_frames_run = 15

model_sheet_hit = "res://sprite/Player/Andrix/hit/andrix-attack.png"
model_hframes_hit = 5
model_vframes_hit = 5
model_frames_hit = 25

; animazione "hurt" (opzionale): scommentare e puntare al foglio quando esiste
; model_sheet_hurt = "res://sprite/Player/Andrix/hurt/andrix-hurt.png"
; model_hframes_hurt = 5
; model_vframes_hurt = 2
; model_frames_hurt = 8
